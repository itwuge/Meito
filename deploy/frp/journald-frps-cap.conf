# =============================================================================
# Meito 打洞协调节点 —— journald 容量与轮转上限
#
# 安装位置：/etc/systemd/journald.conf.d/99-frps-cap.conf
# 生效方式：systemctl restart systemd-journald
#
# 背景：
#   frps.toml 把日志输出到 console，由 systemd 写入 journald。
#   frp 自带的文件日志只按天轮转、没有单文件大小上限，不适合 40 GiB 系统盘。
#   journald 可以在运行期间按总容量上限清理旧日志，属于硬上限。
#
# 代价：SystemMaxUse 是 journald 全局上限，不只是 frps 的日志。
#   本节点只运行 frps 与 systemd 自身，256 MiB 足够；
#   如果以后在同一台机器上增加其他服务，需要重新评估这个值。
# =============================================================================

[Journal]
# 持久化到 /var/log/journal，重启后日志仍在；默认 auto 在部分镜像上可能是内存日志。
Storage=persistent

# journald 总磁盘占用硬上限 256 MiB（约占 40 GiB 盘的 0.6%）。
SystemMaxUse=256M

# 单个 journal 文件上限，避免单个文件过大影响轮转。
SystemMaxFileSize=32M

# 最长保留 14 天；容量与时间两个条件谁先满足就清理谁。
MaxRetentionSec=14d

# journald 自身的速率限制；与 frps.service 的 LogRateLimit 双重限流。
RateLimitIntervalSec=30s
RateLimitBurst=1000
