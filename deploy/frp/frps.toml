# =============================================================================
# Meito 打洞协调节点 —— frps 配置
#
# 适用版本：frp v0.71.1（linux_amd64）
# 节点定位：只交换 frpc 注册信息与 XTCP 打洞协调消息，不承载会话数据。
#
# 本文件不含任何密钥。auth.token 通过 auth.tokenSource 从服务端本地文件读取，
# 生成、存放、轮换步骤见 credentials.md。
#
# 配置原则：
#   1. 只保留 frpc 控制端口（bindPort）与 token 鉴权。
#   2. 不配置任何 HTTP/HTTPS vhost、TCP/UDP 远程端口、tcpmux、SSH 网关。
#   3. 不配置仪表盘（webServer），避免管理 API 出现在公网。
#   4. 不启用 KCP/QUIC，避免额外 UDP 监听面。
# =============================================================================

# 监听地址。ECS 公网 IP 通过 NAT 映射到内网 ENI，frps 绑定 0.0.0.0 即可接受
# 公网入口流量；真正的访问控制由安全组 sg-2vchr9d5anwtxrk1y1vi 完成。
bindAddr = "0.0.0.0"

# 唯一的控制端口。frpc 登录、心跳、XTCP 打洞协调消息都走这条 TCP 连接（TLS 加密）。
# 安全组只需放行这一条 TCP 入方向规则。
bindPort = 7000

# 不向客户端回传内部错误细节，减少信息泄露；排障时可临时改为 true 并记录变更，
# 排障结束后必须改回 false 并重启。
detailedErrorsToClient = false

# 打洞策略分析数据只保留 24 小时。节点只有 2 GiB 内存，缩短保留窗口可以降低
# 长期驻留数据的增长风险；frp 默认值是 168 小时。
natholeAnalysisDataReserveHours = 24

# ===== 鉴权 =====

[auth]
# 使用 token 鉴权；不启用 OIDC，避免再引入外部身份服务依赖。
method = "token"

# 心跳与新工作连接也校验 token（不只是首次登录）。
# 作用：即使控制连接建立后，伪造的心跳/新工作连接也无法接入。
additionalScopes = ["HeartBeats", "NewWorkConns"]

# 从服务端本地文件读取 token，避免 token 出现在：
#   - 本仓库的任何文件
#   - systemd 的 Environment= 或命令行参数
#   - journald 日志
# tokenSource 是 frp v0.64.0 新增字段，本配置锁定 v0.71.1 满足版本要求。
tokenSource.type = "file"
tokenSource.file.path = "/etc/frp/frps.token"

# ===== 传输层 =====

[transport]
# 强制只接受 TLS 连接。frpc 自 v0.50.0 起默认开启 TLS，因此本项不会让正常客户端
# 掉线；但如果 frpc 版本低于 v0.50 或被人为关闭 TLS，登录会被拒绝。
# 注意：这保证传输加密，不等同于服务端身份认证；服务端使用自动生成的自签名证书。
tls.force = true

# 其余传输参数保持 v0.71.1 默认值：
#   tcpMux = true
#   tcpMuxKeepaliveInterval = 30s
#   maxPoolCount = 5
# 不显式写出，避免把未验证的调优值当成结论。

# ===== 日志 =====

[log]
# 输出到 stdout，由 systemd 收集进 journald。
# 落盘位置：/var/log/journal（Storage=persistent 时）。
# 容量和轮转由 journald-frps-cap.conf 控制，原因：
#   frp 自带的文件日志只按天轮转（maxDays），没有单文件大小上限；
#   在 40 GiB 系统盘上，日志洪峰可能在一天内写满磁盘。
# 如果必须使用普通文件日志，请同时部署文件级限长策略，不要只依赖 maxDays。
to = "console"
level = "info"
maxDays = 7

# =============================================================================
# 明确“不配置”的字段（以下为审计说明，不是可执行配置）
#
# kcpBindPort / quicBindPort
#   不配置 => 0 => 不监听 KCP/QUIC。两者都是 UDP 控制通道，本场景不需要，
#   多开一个 UDP 端口只会扩大攻击面。
#
# vhostHTTPPort / vhostHTTPSPort / tcpmuxHTTPConnectPort
#   不配置 => 0 => 不监听 HTTP/HTTPS/tcpmux。它们会承载应用层流量，属于禁止能力。
#
# subDomainHost
#   不配置 => 不提供按子域名的 HTTP 代理。
#
# sshTunnelGateway
#   不配置 => 不启用 frps 自带 SSH 网关。它会引入第二套入口，且需要额外密钥文件。
#
# webServer
#   不配置 => 仪表盘端口为 0 => 关闭。仪表盘 API 能查询会话信息、管理代理，
#   任何情况下都不得对公网开放；如确需排障，只能绑定 127.0.0.1 并通过 SSH 隧道访问。
#
# allowPorts
#   不配置。原因：frps 没有“按代理类型白名单”的配置项，allowPorts 只限制
#   tcp/udp 代理可绑定的远程端口，不能禁止 stcp/xtcp。真正的“只打洞”约束靠：
#     - 安全组只放行 TCP 7000，关闭全部数据端口；
#     - token 只交给受控 frpc；
#     - 客户端配置审计禁止 stcp/fallbackTo；
#     - 服务端监听面与字节计数验证（见 verification.md）。
#   如果未来需要协议层强制，只能自研 frps NewProxy 插件，当前未实现。
#
# stcp / fallbackTo
#   frps 配置中没有这些字段；它们属于 frpc 的代理/visitor 配置。
#   本项目禁止在 frpc 侧出现 stcp 与 fallbackTo，见设计文档 9.1/9.3。
# =============================================================================
